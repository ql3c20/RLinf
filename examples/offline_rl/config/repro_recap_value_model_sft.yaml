# Usage: bash examples/offline_rl/advantage_labeling/recap/run_value_sft.sh recap_value_model_sft

defaults:
  - model/recap_value_model@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-3

runner:
  task_type: sft
  logger:
    log_path: "/pfs/pfs-oHNwH0/lqb/results/recap"
    project_name: "rlinf-vla-posttrain"
    experiment_name: "recap_value_sft_rollout_task0_6k"
    logger_backends: ["tensorboard", "wandb"]

  max_epochs: 30000
  max_steps: 6000
  val_check_interval: 500
  save_interval: 1000
  eval_only: false
  resume_dir: null

data:
  # Must match Step 1's data.tag; loads meta/returns_{tag}.parquet (null = legacy meta/returns.parquet)
  tag: "fail300"

  train_data_paths:
    - dataset_path: "/pfs/pfs-oHNwH0/lqb/datasets/RECAP-Libero10-Task0-48succ-Data-git/libero10_task0_sft"
      type: "sft"
      weight: 1.0
      robot_type: "libero"
      model_type: "pi05"
    - dataset_path: "/pfs/pfs-oHNwH0/lqb/datasets/RECAP-Libero10-Task0-48succ-Data-git/libero10_task0_train"
      type: "rollout"
      weight: 1.0
      robot_type: "libero"
      model_type: "pi05"

  eval_data_paths:
    - dataset_path: "/pfs/pfs-oHNwH0/lqb/datasets/RECAP-Libero10-Task0-48succ-Data-git/libero10_task0_eval"
      name: "task0_mixed_success_failure_64"
      robot_type: "libero"
      model_type: "pi05"

  train_num_workers: 8
  eval_num_workers: 4
  prefetch_factor: 4
  persistent_workers: false
  pin_memory: false
  include_state: true
  gamma: 1.0
  action_horizon: 10
  normalize_to_minus_one_zero: true
  include_next_obs: false
  action_dim: 7
  robot_type: "libero"
  model_type: "pi05"
  balance_weights: true
  seed: 42

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 256
  seed: 0

  model:
    precision: bf16
    siglip_path: "/pfs/pfs-oHNwH0/lqb/models/siglip2-so400m-patch14-224"
    gemma3_path: "/pfs/pfs-oHNwH0/lqb/models/gemma-3-270m"
    tokenizer_path: "/pfs/pfs-oHNwH0/lqb/models/gemma-3-270m"
    freeze_vlm: false
    action_dim: 7
    action_horizon: 10

  optim:
    lr: 5.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1e-10
    clip_grad: 1.0
    lr_scheduler: "constant"
    lr_warmup_steps: 500
    total_training_steps: 6000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
