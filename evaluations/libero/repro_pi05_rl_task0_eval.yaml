defaults:
  - env/libero_10@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 4-7

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: "rlinf-vla-posttrain"
    experiment_name: "pi05_rl_task0_eval"
    logger_backends: ["tensorboard"]
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"
  eval:
    rollout_epoch: 1
    total_num_envs: 48
    task_id_filter: [0]
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    group_size: 1
    use_fixed_reset_state_ids: true
    is_eval: true
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: false
  unnorm_key: libero_10
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: "/pfs/pfs-oHNwH0/lqb/models/RLinf-Pi05-LIBERO-SFT"
    model_type: "openpi"
    num_action_chunks: 10
    add_value_head: false
    openpi:
      task: rl
      train_expert_only: true
      noise_method: "flow_sde"
      joint_logprob: false
      torch_compile: false

