defaults:
  - env/libero_10@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "recap_cfg_task0_quick_eval_50"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 50
    task_id_filter: [0]
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 520
    max_steps_per_rollout_epoch: 520
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/pfs/pfs-oHNwH0/lqb/models/pi05_base_openpi"
    model_type: "cfg_model"
    num_action_chunks: 5
    openpi:
      task: eval
      config_name: pi05_libero
      noise_level: 0.3
      train_expert_only: false
      guidance_type: positive
      positive_only_conditional: true
      cfgrl_guidance_scale: 1.0
